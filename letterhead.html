      @page {
        size: A4;
        margin: 0;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: #e8e8e8;
      }

      .sheet {
        position: relative;
        width: 210mm;
        height: 297mm;
        margin: 20px auto;
        background: #fff;
        overflow: hidden;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.2);
      }

      /* locked artwork layer — full bleed, behind everything */
      .sheet > .art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      /* ---------------------------------------------------------------------
   Letterhead wording. Each line is absolutely placed at its original
   coordinate, in points, so the header and footer are identical to the
   source artwork. Change the words, not the positions.
   --------------------------------------------------------------------- */
      .txt p {
        position: absolute;
        margin: 0;
        padding: 0;
        line-height: 1;
        white-space: nowrap;
        color: #000;
        z-index: 1;
      }
      .txt .wordmark {
        font-family: "LH Poppins", Poppins, sans-serif;
        font-weight: 400;
      }
      .txt .wordmark b {
        font-weight: 700;
      }
      .txt .tagline {
        font-family: "LH Poppins", Poppins, sans-serif;
        font-weight: 500;
      }
      .txt .web {
        font-family: "LH Montserrat", Montserrat, sans-serif;
        font-weight: 700;
      }
      .txt .phone,
      .txt .email,
      .txt .addr {
        font-family: "LH Inter", Inter, sans-serif;
        font-weight: 400;
      }

      /* ---------------------------------------------------------------------
   Editable body area — aligned to the header rule (13.01mm from the
   left, 184.06mm wide), below the rule and clear of the address strip.
   --------------------------------------------------------------------- */
      .content {
        position: absolute;
        z-index: 1;
        left: 13mm;
        top: 52mm;
        width: 184mm;
        height: 220mm;
        overflow: hidden;
        font-family:
          "LH Inter", Inter, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 10.5pt;
        line-height: 1.7;
        color: #1b1b1b;
      }
      .content p {
        margin: 0 0 10pt;
      }
      .content h1 {
        margin: 0 0 12pt;
        font-size: 13pt;
        font-weight: 600;
      }
      .content .meta {
        margin: 0 0 18pt;
        color: #555;
      }
      .content .sign {
        margin-top: 24pt;
      }

      @media print {
        html,
        body {
          background: #fff;
        }
        .sheet {
          margin: 0;
          box-shadow: none;
        }
        * {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }

      @media screen and (max-width: 820px) {
        body {
          overflow-x: hidden;
        }
        .sheet {
          transform: scale(0.45);
          transform-origin: top center;
          margin-bottom: -160mm;
        }
      }
    </style>
  </head>
